; Settings for Xuan-Yuan Sword: The Scar of Sky.
; Delete this file to get the defaults back.

[general]
; pc: improved defaults.  port: play exactly like the original release.
profile = pc
; Use Steam for achievements and cloud saves.
steam = on
; Write a log file and allow screenshots with F9 (for bug reports).
debug_log = off

[video]
; Window size: auto, or a size such as 1920x1440.
window = auto
; Fill the whole screen.
fullscreen = off
; Sync to the display to prevent tearing.
vsync = on
; Smoother motion: adds in-between frames (adds a tiny delay).
; debug shows what it is doing in colour.
frame_gen = off
; Smooth motion in menus too (off keeps menus quick to respond).
frame_gen_menus = off
; Detail of the smoothing: 2, 4 or 8. Smaller is finer but uses more CPU.
frame_gen_block = 2
; Frame rate limit for smooth motion; 0 matches your display.
max_fps = 60
; How pixels are scaled up. sharp: crisp and even (recommended).
; linear: soft, like the original.  nearest: crisp, but pixels can be uneven.
filter = nearest
; Picture size. fit: as large as possible, never stretched.
; integer: the largest exact 2x, 3x, 4x... size, so every pixel is the same size.
; original: stretched like the original release.
scale = integer
; Retro screen effect: off, scanlines (CRT lines) or lcd (pixel grid).
; Looks best with scale = integer.
overlay = off
; Strength of the screen effect, 0-100.
overlay_strength = 40
; Smooth out colour banding in skies and fog.
deband = on
; Mouse pointer. game: the game's own.  system: your normal pointer (more responsive).
cursor = game
; Decorative art at the sides of wide screens.
border_art = on
; On-screen touch buttons from the mobile version.
touch_overlay = off

[text]
; Line breaks in dialogue. reflow: rewrap to fit each box (recommended).
; wrap: keep the original breaks, add more if needed.  off: as written.
wrap = reflow
; Resize dialogue boxes to fit their text.
fit_boxes = on
; Log how text is wrapped (for translators/editors).
wrap_log = off
